name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: ${{ matrix.os }} ${{ matrix.shard }}/4
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        shard: [0, 1, 2, 3]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.lutece-references
            ~/.m2/repository
          key: lutece-${{ runner.os }}-${{ github.run_id }}
          restore-keys: lutece-${{ runner.os }}-
      - name: Tools
        run: |
          python -m pip install --quiet PyYAML
          npm install -g @anthropic-ai/claude-code
      - name: Lutece references
        run: |
          rm -f ~/.lutece-references/.last-sync
          bash hooks/sync-references
          for i in $(seq 1 120); do [ -f ~/.lutece-references/.last-sync ] && exit 0; sleep 10; done
          echo "the reference sync did not finish"; exit 1
      - name: Maven artifacts the tests read
        run: |
          . tools/v8-floor.conf
          REPOS=lutece::::https://dev.lutece.paris.fr/maven_repository,luteceSnapshot::::https://dev.lutece.paris.fr/snapshot_repository
          FM=$(curl -fsS https://repo1.maven.org/maven2/org/freemarker/freemarker/maven-metadata.xml | grep -oE '<version>2\.3\.[0-9]+</version>' | sed 's/<[^>]*>//g' | sort -V | tail -1)
          SNAP=$(python3 tools/latest-lutece.py snapshot fr.paris.lutece:lutece-core | cut -d: -f3)
          for a in fr.paris.lutece:lutece-core:RELEASE fr.paris.lutece:lutece-core:8.0.1 "fr.paris.lutece:lutece-core:$V8_FLOOR_CORE" "fr.paris.lutece:lutece-core:$SNAP" \
                   "fr.paris.lutece.tools:lutece-site-pom:$V8_FLOOR_SITE_PARENT:pom" "org.freemarker:freemarker:$FM"; do
            mvn -B -q dependency:get -Dartifact="$a" -Dtransitive=false -DremoteRepositories="$REPOS"
          done
      - name: Tests
        run: bash scripts/ci-tests.sh ${{ matrix.shard }} 4
      - name: Plugin manifests
        if: matrix.shard == 0
        run: claude plugin validate .

  passed:
    name: tests
    needs: tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: '[ "${{ needs.tests.result }}" = success ]'
