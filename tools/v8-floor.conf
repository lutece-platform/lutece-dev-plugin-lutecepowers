# The Lutece 8 level lutecepowers supports: the latest one published, read in the Lutece repositories by
# latest-lutece.py (cached an hour, the local Maven repository when they cannot be reached), never written down.
# Read by check-v8-floor.sh and by verify-migration.sh (PM06), site_check.py (SI01). A project whose resolved
# lutece-core is below V8_FLOOR_CORE (the latest published lutece-core 8.x, a beta included) is refused by every
# analysis, gate and bench; a parent below V8_FLOOR_PARENT (the latest released lutece-global-pom 8.x), or a site
# parent below V8_FLOOR_SITE_PARENT (the latest released lutece-site-pom 8.x), is a FAIL. A snapshot is never the
# floor: check-v8-floor.sh only warns when a resolved snapshot is an older build than the latest one deployed
# (V8_SNAPSHOT_CORE, V8_SNAPSHOT_CORE_BUILD). An environment value pins one, to reproduce a case.
# V8_FLOOR_UNVERIFIED is set when the repositories could not be read: the floor is then the local Maven repository's.
_lp_ask=()
[ -n "${V8_FLOOR_CORE:-}" ] || _lp_ask+=(fr.paris.lutece:lutece-core)
[ -n "${V8_FLOOR_PARENT:-}" ] || _lp_ask+=(fr.paris.lutece.tools:lutece-global-pom)
[ -n "${V8_FLOOR_SITE_PARENT:-}" ] || _lp_ask+=(fr.paris.lutece.tools:lutece-site-pom)
if [ ${#_lp_ask[@]} -gt 0 ]; then
    _lp_out=$(python3 "$(dirname "${BASH_SOURCE[0]}")/latest-lutece.py" release "${_lp_ask[@]}" 2>/dev/null) \
        || [ $? != 3 ] || V8_FLOOR_UNVERIFIED="the Lutece repositories cannot be read, the floor is the local Maven repository's"
    V8_FLOOR_CORE=${V8_FLOOR_CORE:-$(sed -n 's/^fr\.paris\.lutece:lutece-core:\([^:]*\).*/\1/p' <<< "$_lp_out")}
    V8_FLOOR_PARENT=${V8_FLOOR_PARENT:-$(sed -n 's/^fr\.paris\.lutece\.tools:lutece-global-pom:\([^:]*\).*/\1/p' <<< "$_lp_out")}
    V8_FLOOR_SITE_PARENT=${V8_FLOOR_SITE_PARENT:-$(sed -n 's/^fr\.paris\.lutece\.tools:lutece-site-pom:\([^:]*\).*/\1/p' <<< "$_lp_out")}
fi
# Nothing published nor in the local repository: the first Lutece 8 level, so a machine offline is not blocked.
V8_FLOOR_CORE=${V8_FLOOR_CORE:-8.0.0}
V8_FLOOR_PARENT=${V8_FLOOR_PARENT:-8.0.0}
V8_FLOOR_SITE_PARENT=${V8_FLOOR_SITE_PARENT:-8.0.0}
# What a generic project declares: the lutece-core range lower bound and <min-core-version>, the first Lutece 8
# release, so the range stays open and Maven resolves the latest core. A project that pins lutece-core pins it at
# V8_FLOOR_CORE or later. The floor above is enforced on the resolved core.
V8_DECLARED_CORE=${V8_DECLARED_CORE:-8.0.0}
