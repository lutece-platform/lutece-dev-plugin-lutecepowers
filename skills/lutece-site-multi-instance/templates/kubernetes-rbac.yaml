# Hazelcast Kubernetes discovery (member join "kubernetes"): Service on 5701 and read rights in the namespace.
apiVersion: v1
kind: Service
metadata:
  name: <site>-hazelcast          # = hz.service-name (jvm.options / JVM_ARGS)
spec:
  clusterIP: None
  selector:
    app: <site>                   # labels of the Lutece pods
  ports:
    - name: hazelcast
      port: 5701
      targetPort: 5701
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: <site>-hazelcast
rules:
  - apiGroups: [""]
    resources: ["endpoints", "pods", "services"]
    verbs: ["get", "list"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: <site>-hazelcast
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: <site>-hazelcast
subjects:
  - kind: ServiceAccount
    name: <service-account-of-the-pods>
