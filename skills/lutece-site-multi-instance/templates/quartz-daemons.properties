# webapp/WEB-INF/conf/override/quartz-daemons.properties (every .properties file of conf/override is read).
# plugin-quartz-scheduler replaces the daemon executor of the core: a local scheduler for every daemon, and a clustered one
# (JDBC store, tables qrtz_* created by the plugin Liquibase script) for the daemons declared exclusive below.
# The clustered scheduler is off by default in the plugin (quartz-scheduler.properties): without this line every
# "exclusive" daemon still runs on every replica.
quartzscheduler.cluster.enable=true

# Exclusive daemons: quartzscheduler.daemon.<daemon-id>.disallowedClusterConcurrentExecution=true
# <daemon-id> is the <daemon-id> of the descriptor: WEB-INF/conf/core.xml and WEB-INF/plugins/<plugin>.xml. List them all:
#   grep -ho "<daemon-id>[^<]*" target/<site>-*/WEB-INF/conf/core.xml target/<site>-*/WEB-INF/plugins/*.xml
# Exclusive: a daemon that acts on shared state (database, mails, workflow, shared index, purges).
# Local (not listed): a daemon that works on a resource of its own pod, such as the core search index `indexer`
# (search.lucene.indexPath, one index per pod) and threadLauncherDaemon.
quartzscheduler.daemon.mailSender.disallowedClusterConcurrentExecution=true
quartzscheduler.daemon.accountLifeTimeDaemon.disallowedClusterConcurrentExecution=true
# ... one line per exclusive daemon of the site
