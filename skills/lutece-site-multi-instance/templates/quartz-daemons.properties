# plugin-quartz-scheduler replaces the daemon executor of the core with a clustered Quartz scheduler.
# A daemon that must run once per cluster (mails, purges, workflow automatic actions...) is declared here.
# Key: quartzscheduler.daemon.<daemon-id>.disallowedClusterConcurrentExecution=true
# <daemon-id> is the <daemon-id> of the descriptor: WEB-INF/conf/core.xml and WEB-INF/plugins/<plugin>.xml.
# List them all, for example:
#   grep -ho "<daemon-id>[^<]*" target/<site>/WEB-INF/conf/core.xml target/<site>/WEB-INF/plugins/*.xml
quartzscheduler.daemon.mailSender.disallowedClusterConcurrentExecution=true
quartzscheduler.daemon.accountLifeTimeDaemon.disallowedClusterConcurrentExecution=true
# ... one line per exclusive daemon of the site
