# Hazelcast client of the Lutece application cache (lutece.cache.jcache.*, cluster.xml).
hazelcast-client:
  # Same cluster-name as the member.
  cluster-name: <site>
  network:
    # The client connects to the member of its own pod, then discovers the other members from the cluster topology:
    # no Kubernetes API, no rights.
    cluster-members:
      - 127.0.0.1:5701
    redo-operation: true
  # Near cache: local copy of the entries read, invalidated on every change (immediate with
  # hazelcast.cache.invalidation.batch.enabled=false on the member). Required: without it every cache read is a network
  # call (measured: 2.2 req/s against 37). OBJECT: no copy on read (BINARY: a third more CPU). An expiry or eviction on
  # the member does not invalidate it: its time-to-live stays below the shortest member lifetime of the Lutece caches.
  near-cache:
    "*":
      in-memory-format: OBJECT
      invalidate-on-change: true
      time-to-live-seconds: 600
      max-idle-seconds: 0
      eviction:
        eviction-policy: LRU
        max-size-policy: ENTRY_COUNT
        size: 10000
    # Forms hands out the objects of its cache without copying them: with OBJECT, two requests of a pod share a list
    # and one sorts it while the other reads it (ConcurrentModificationException on the multiview). BINARY gives each
    # reader its own copy, as Ehcache does (+5 % CPU); keep it until every plugin of the site copies what it modifies.
    formsCacheService:
      in-memory-format: BINARY
      invalidate-on-change: true
      time-to-live-seconds: 600
      max-idle-seconds: 0
      eviction:
        eviction-policy: LRU
        max-size-policy: ENTRY_COUNT
        size: 10000
