# Deployment of the site replicas, tested on minikube (rolling restart and forced pod deletion under load: no error).
# Use with kubernetes-rbac.yaml (Hazelcast Service + Role/RoleBinding).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: <site>
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: <site>
  template:
    metadata:
      labels:
        app: <site>
    spec:
      serviceAccountName: <service-account-of-the-pods>
      # Above hazelcast.graceful.shutdown.max.wait (45 s) + preStop
      terminationGracePeriodSeconds: 70
      containers:
        - name: lutece
          image: <registry>/<site>:<version>
          env:
            - name: MP_CONFIG_PROFILE
              value: <profile>
            # Liberty thread pool: 2 threads per CPU of the limit (server.xml: executor bounded by executor.threads)
            - name: EXECUTOR_THREADS
              value: "4"
            # Liquibase runs from one instance only (a job or a single replica), never from every replica
            - name: JVM_ARGS
              value: "-Dliquibase.enabled.at.startup=false"
          ports:
            - name: http
              containerPort: 9090
            - name: hazelcast
              containerPort: 5701
          resources:
            requests:
              cpu: "1"
              memory: 1600Mi
            # CPU limit above the request: OpenJ9 JIT uses about a third of 2 CPUs during the first minutes under load
            limits:
              cpu: "2"
              memory: 1600Mi
          startupProbe:
            httpGet:
              path: /health/started
              port: http
            periodSeconds: 5
            # 3 min, about twice the slowest measured start (26 to 100 s): a pod started while the database is down fails
            # to load the webapp and is restarted after 3 min instead of 5; measure the start of the target cluster first
            failureThreshold: 36
            # The 1 s default times out while two replicas start together
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            # A loaded pod answers slowly (the health check waits in the bounded thread pool): leave it the time to
            # answer; readiness takes it out of the Service, it does not kill it
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            failureThreshold: 6
            # Liveness detects a frozen pod, not a slow one: with the 1 s default, the pod left alone with the whole load
            # after the loss of the other one was killed in turn (cascade)
            timeoutSeconds: 10
          lifecycle:
            # Leave the Service before OpenLiberty stops
            preStop:
              exec:
                command: ["sleep", "10"]
          volumeMounts:
            # Parent directory of the Forms Lucene index (indexPath=/opt/data/lucene/plugins/forms/index)
            - name: lucene
              mountPath: /opt/data/lucene
      volumes:
        # Shared by every replica: the back office authorization on a response searches this index
        - name: lucene
          persistentVolumeClaim:
            claimName: <site>-lucene   # ReadWriteMany
