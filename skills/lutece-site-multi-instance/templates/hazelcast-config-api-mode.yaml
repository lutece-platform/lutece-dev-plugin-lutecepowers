# Hazelcast member started by sessionCache-1.0 (HTTP session), one per replica.
hazelcast:
  # Site specific: two sites of the same namespace must not merge their clusters.
  cluster-name: <site>
  properties:
    # Pod shutdown: hand the partitions (sessions) over before leaving. The default TERMINATE leaves without transfer.
    hazelcast.shutdownhook.policy: GRACEFUL
    # Seconds; keep it below terminationGracePeriodSeconds of the pod (60 recommended).
    hazelcast.graceful.shutdown.max.wait: 45
    # No JVM shutdown hook: it closed the member while OpenLiberty was still serving the requests in flight (500 errors
    # during a rolling update). OpenLiberty closes the member when it stops sessionCache-1.0, after the application,
    # and HazelcastInstance.shutdown( ) is still graceful (partition migration, bounded by graceful.shutdown.max.wait).
    hazelcast.shutdownhook.enabled: false
    # Near cache of the clients (Lutece cache): invalidations sent immediately instead of batched (seconds of staleness).
    hazelcast.cache.invalidation.batch.enabled: false
  network:
    # Fixed port: the Kubernetes Service and the Lutece cache client (127.0.0.1:5701) expect it.
    port:
      auto-increment: false
      port: 5701
    join:
      multicast:
        enabled: false
      kubernetes:
        enabled: true
        # No namespace: the namespace of the pod. Default in jvm.options, overridable with JVM_ARGS="-Dhz.service-name=...".
        service-name: ${hz.service-name}
        service-port: 5701
  # Lutece caches: no "cache:" section by default (lifetime from Lutece, 10,000 entries LRU). Never "*": it also matches
  # the OpenLiberty session caches and the application no longer starts on a cluster started from zero (SESN0307E).
  # A cache that needs another size is declared by its JCache name (Lutece name without spaces); the declaration
  # replaces the Lutece configuration of that cache, lifetime included, and needs a lutece-core whose cache layer is
  # fixed (reference/plugin-prerequisites.md):
  # cache:
  #   formsCacheService:
  #     expiry-policy-factory:
  #       timed-expiry-policy-factory: {expiry-policy-type: CREATED, duration-amount: 86400, time-unit: SECONDS}
  #     eviction: {size: 20000, max-size-policy: ENTRY_COUNT, eviction-policy: LRU}
