# What this artefact must refuse. Mandatory file (`<artefact>-negative.yaml`): a mutation without its CSRF token,
# one empty-mandatory-field and one duplicate-key refusal per main entity, an unknown id answered gracefully, and,
# when the artefact enforces rights of its own, a restricted account seeded in harness/db/seed-<target>.sql.
# The oracle is `expect_message: error` (a Lutece AdminMessage, never an internal error) plus the row unchanged.
scenarios:

  # Two forgeries, both mandatory. The POST without token is what the core filter refuses. The GET is a link or an
  # <img> in any page: core 8.0.x runs an @Action on GET without checking the token, so this scenario is RED until
  # the core is fixed. Keep it red and labelled, never exclude it, never work around it in the plugin.
  - id: myentity_csrf_post_without_token_refused
    title: Une suppression postée sans jeton CSRF est refusée et la ligne reste en base
    req: MYPLUGIN_MANAGEMENT
    steps:
      - http: {url: 'jsp/admin/plugins/myplugin/ManageMyEntities.jsp', method: POST, headers: {Content-Type: application/x-www-form-urlencoded}, body: 'action=removeMyEntity&id=9001'}
      - sql: {query: "SELECT COUNT(*) FROM myplugin_myentity WHERE id_myentity=9001", expect: 1}

  - id: myentity_csrf_post_with_page_parameter_refused
    title: "Défaut du core : un POST sans jeton auquel on ajoute page=x ne doit rien supprimer"
    description: >-
      Core defect (expected red until lutece-core is fixed): SecurityTokenHandler takes the XPage branch as soon as the
      request carries a page parameter, finds no XPage of that name and does not filter, even on /jsp/admin/.
    req: MYPLUGIN_MANAGEMENT
    steps:
      - http: {url: 'jsp/admin/plugins/myplugin/ManageMyEntities.jsp', method: POST, headers: {Content-Type: application/x-www-form-urlencoded}, body: 'action=removeMyEntity&id=9001&page=x'}
      - sql: {query: "SELECT COUNT(*) FROM myplugin_myentity WHERE id_myentity=9001", expect: 1}

  - id: myentity_csrf_get_without_token_refused
    title: "Défaut du core : une suppression appelée par un simple lien, sans jeton, ne doit rien supprimer"
    description: >-
      Core defect (expected red until lutece-core refuses an @Action on GET): the link deletes the row.
    req: MYPLUGIN_MANAGEMENT
    steps:
      - goto: jsp/admin/plugins/myplugin/ManageMyEntities.jsp?action=removeMyEntity&id=9001
      - sql: {query: "SELECT COUNT(*) FROM myplugin_myentity WHERE id_myentity=9001", expect: 1}

