# What this artefact must refuse. Mandatory file (`<artefact>-negative.yaml`): a mutation without its CSRF token,
# one empty-mandatory-field and one duplicate-key refusal per main entity, an unknown id answered gracefully, and,
# when the artefact enforces rights of its own, a restricted account seeded in harness/db/seed-<target>.sql.
# The oracle is `expect_message: error` (a Lutece AdminMessage, never an internal error) plus the row unchanged.
scenarios:

  - id: myentity_csrf_remove_without_token_refused
    title: Une suppression appelée sans jeton CSRF est refusée et la ligne reste en base
    req: MYPLUGIN_MANAGEMENT
    steps:
      - goto: jsp/admin/plugins/myplugin/ManageMyEntities.jsp?action=doRemoveMyEntity&id=9001
      - expect_message: error
      - sql: {query: "SELECT COUNT(*) FROM myplugin_myentity WHERE id_myentity=9001", expect: 1}

