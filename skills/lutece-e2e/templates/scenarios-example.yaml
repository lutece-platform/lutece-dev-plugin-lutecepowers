  # Ordering actions (Do*Up / Do*Down / Do*In / Do*Out): never assert against a shared reference row — moving your
  # element past it drifts the reference and breaks idempotence. Create two siblings of your own, assert their
  # relative order flips, remove both. `serial: true` because the order column is shared.
  # - id: myentity_order
  #   title: Entités — deux entités créées permutent leur ordre, la référence n'est pas touchée
