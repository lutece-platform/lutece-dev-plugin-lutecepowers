# Business scenarios of this artefact's back office. One CRUD lifecycle per admin feature; the database is the
# oracle. `req` = the Lutece right (see artifacts/inventory.md). Vocabulary: tests/test_scenarios.py header.
scenarios:

  - id: example_entry_screens
    title: Les écrans d'entrée de la fonctionnalité s'affichent sans erreur
    # Optional: shown in the report under the title. A `>-` block, because a `: ` in a bare scalar breaks the YAML.
    description: >-
      Pourquoi ce scénario existe, ce qu'il épingle, ce qu'un relecteur doit savoir avant de lire les étapes.
    req: MYPLUGIN_MANAGEMENT
    steps:
      - goto: jsp/admin/plugins/myplugin/ManageMyEntities.jsp
      - expect_ok:

