  #     - fill: {'input[name="title"]': 'A {{rand}}'}
  #     - submit: 'form[action*="ManageMyEntities.jsp"]'
  #     - sql_set: {var: a, query: "SELECT id_myentity FROM myplugin_myentity WHERE title='A {{rand}}'"}
  #     - goto: jsp/admin/plugins/myplugin/ManageMyEntities.jsp?view=createMyEntity
  #     - fill: {'input[name="title"]': 'B {{rand}}'}
  #     - submit: 'form[action*="ManageMyEntities.jsp"]'
  #     - sql_set: {var: b, query: "SELECT id_myentity FROM myplugin_myentity WHERE title='B {{rand}}'"}
  #     - sql_set: {var: sgn0, query: "SELECT SIGN((SELECT id_order FROM myplugin_myentity WHERE id_myentity={{b}}) - (SELECT id_order FROM myplugin_myentity WHERE id_myentity={{a}}))"}
  #     - goto: jsp/admin/plugins/myplugin/ManageMyEntities.jsp?action=doMoveUp&id={{b}}
  #     - sql: {query: "SELECT SIGN((SELECT id_order FROM myplugin_myentity WHERE id_myentity={{b}}) - (SELECT id_order FROM myplugin_myentity WHERE id_myentity={{a}}))", expect: '-{{sgn0}}'}
