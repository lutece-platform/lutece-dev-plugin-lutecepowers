# Environnement de test à conteneurs mock (extensible). Activation à la carte via les profils Docker :
#   docker compose --profile mail --profile captcha up -d   (ou --profile all)
services:

  # Mail — capture des envois (Phase 5)
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: lutece-e2e-mailhog
    profiles: ["mail", "all"]
    ports: ["1025:1025", "8025:8025"]
    logging: { driver: "none" }

  # CAPTCHA — mock de CaptchEtat/PISTE (OAuth + API captcha) → répond « valide »
  wiremock:
    image: wiremock/wiremock:3.9.1
    container_name: lutece-e2e-wiremock
    profiles: ["captcha", "all"]
    ports: ["8090:8080"]
    command: ["--global-response-templating", "--verbose"]
    volumes:
      - ./wiremock:/home/wiremock

