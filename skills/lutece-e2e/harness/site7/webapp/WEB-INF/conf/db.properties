# Lutece 7 reads its pool from this file, not from a container datasource: the values are those of the compose
# `db` service. The URL uses the mysql scheme on purpose — the Ant build picks its target (init_mysql) from it.
portal.poolservice=fr.paris.lutece.util.pool.service.LuteceConnectionService
portal.driver=com.mysql.cj.jdbc.Driver
portal.url=jdbc:mysql://db:3306/lutece?autoReconnect=true&useUnicode=yes&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
portal.dbname=lutece
portal.user=lutece
portal.password=lutece
portal.initconns=2
portal.maxconns=20
portal.logintimeout=2
portal.checkvalidconnectionsql=SELECT 1
