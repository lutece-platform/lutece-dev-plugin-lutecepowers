# The lowest Lutece 8 level lutecepowers supports, read by check-v8-floor.sh and by verify-migration.sh (PM06).
# A project whose resolved lutece-core is below V8_FLOOR_CORE, or is the V8_FLOOR_CORE snapshot built before
# V8_FLOOR_CORE_BUILD, is refused by every analysis, gate and bench. A parent below V8_FLOOR_PARENT is a FAIL.
V8_FLOOR_PARENT=${V8_FLOOR_PARENT:-8.0.2}
V8_FLOOR_CORE=${V8_FLOOR_CORE:-8.0.2-SNAPSHOT}
V8_FLOOR_CORE_BUILD=${V8_FLOOR_CORE_BUILD:-2026-09-24}
# What a project declares: the lutece-core range lower bound and <min-core-version>. The floor above is enforced on
# the resolved core, not on these declarations.
V8_DECLARED_CORE=${V8_DECLARED_CORE:-8.0.0}
